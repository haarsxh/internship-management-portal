# Render Blueprint: one web service. Express serves the API and the built React app.
services:
  - type: web
    name: internship-portal
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Build-time flag for the one-tap demo sign-in buttons. They ship the seeded demo passwords,
      # so set this to "false" (and redeploy) for anything beyond a demo.
      - key: VITE_DEMO_LOGIN
        value: "true"
